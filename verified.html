<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>키피 이메일 인증</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <img src="icon.png" alt="" />
      <span class="name">키피</span>
    </header>

    <section class="card" id="ok">
      <h1>이메일 인증을 마쳤어요</h1>
      <p>키피 앱으로 돌아가서 가입한 이메일과 비밀번호로 로그인해 주세요.</p>
    </section>

    <section class="card" id="fail" hidden>
      <h1>링크를 쓸 수 없어요</h1>
      <p>인증 링크가 만료됐거나 이미 쓴 링크예요. 키피 앱에서 다시 가입하거나, 이미 인증했다면 그대로 로그인해 보세요.</p>
      <p>계속 안 되면 <a href="mailto:jeongubag999@gmail.com">jeongubag999@gmail.com</a>으로 알려주세요.</p>
    </section>

    <nav>
      <a href="./">키피 소개·문의</a>
    </nav>
    <footer>© 2026 박정우</footer>
  </main>
  <script>
    // Supabase는 실패하면 주소 뒤에 error=... 를 붙여서 보내요. 로그인 정보(토큰)는 이 페이지에서 쓰지 않고 바로 지워요.
    var q = (location.hash || '').slice(1) + '&' + (location.search || '').slice(1);
    if (/(^|&)error(_code)?=/.test(q)) {
      document.getElementById('ok').hidden = true;
      document.getElementById('fail').hidden = false;
    }
    if (location.hash || location.search) history.replaceState(null, '', location.pathname);
  </script>
</body>
</html>
